<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Embedded PASS CHECK</title>
<!--
  A one-page probe for the Teams "Website" tab. It answers one question the Panel Test
  could not: is this page rendering INSIDE the Teams client, or did Teams hand it to the
  browser? It carries no sign-in and reads no data, so a failure here is an embedding
  failure and nothing else. Dummy rows only.

  Hosting rule: wherever this lives must answer GET with a 200 and no X-Frame-Options /
  frame-ancestors that excludes *.teams.microsoft.com and *.cloud.microsoft. The factory
  host fails that today — every GET 302s to Microsoft sign-in, which refuses framing.
-->
<style>
  :root { --pass: #1b7f3b; --fail: #b31b1b; --ink: #222; --muted: #666; --line: #ddd; }
  body { font: 15px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; color: var(--ink); margin: 0; padding: 20px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 16px; }
  .verdict { display: inline-block; font-weight: 700; font-size: 28px; padding: 8px 16px; border-radius: 6px; color: #fff; background: var(--muted); }
  .verdict.pass { background: var(--pass); }
  .verdict.fail { background: var(--fail); }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 16px 0; }
  dt { color: var(--muted); }
  dd { margin: 0; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; word-break: break-all; }
  table { border-collapse: collapse; margin-top: 8px; }
  th, td { text-align: left; padding: 6px 12px; border-bottom: 1px solid var(--line); }
  th { font-weight: 600; }
  .stamp { color: var(--muted); font-size: 12px; margin-top: 16px; }
</style>
</head>
<body>
  <h1>Embedded PASS CHECK</h1>
  <p class="sub">Rollout-PM tab probe. No sign-in, dummy data.</p>

  <div id="verdict" class="verdict">CHECKING…</div>

  <dl>
    <dt>Framed</dt><dd id="framed">…</dd>
    <dt>Parent</dt><dd id="parent">…</dd>
    <dt>Teams SDK</dt><dd id="sdk">…</dd>
    <dt>Teams context</dt><dd id="ctx">…</dd>
    <dt>This page</dt><dd id="href">…</dd>
  </dl>

  <table aria-label="Dummy data">
    <thead><tr><th>Item</th><th>Owner</th><th>Status</th></tr></thead>
    <tbody>
      <tr><td>Panel Test</td><td>Rollout-PM</td><td>Opened in browser</td></tr>
      <tr><td>Embedded PASS CHECK</td><td>Rollout-PM</td><td id="row-status">Pending</td></tr>
      <tr><td>Dashboard (real data)</td><td>Eng</td><td>Not started</td></tr>
    </tbody>
  </table>

  <p class="stamp" id="stamp"></p>

  <script src="https://res.cdn.office.net/teams-js/2.31.0/js/MicrosoftTeams.min.js" crossorigin="anonymous"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const framed = window.self !== window.top;
    let parent = '';
    try { parent = document.referrer ? new URL(document.referrer).origin : ''; } catch { parent = document.referrer; }
    // Teams frames tabs from teams.microsoft.com (classic) or teams.cloud.microsoft (new client);
    // the desktop client's WebView reports the same origins. An empty referrer inside a frame is
    // still a frame, so it counts as PASS with the parent shown as "(no referrer)".
    const teamsParent = /(^|\.)teams\.(microsoft\.com|cloud\.microsoft)$/i.test((() => { try { return new URL(document.referrer).hostname; } catch { return ''; } })());

    $('framed').textContent = framed ? 'yes' : 'no — top-level window';
    $('parent').textContent = parent || (framed ? '(no referrer)' : 'n/a');
    $('href').textContent = location.href;
    $('stamp').textContent = 'Loaded ' + new Date().toISOString() + ' · ' + navigator.userAgent;

    const verdict = $('verdict');
    if (framed) {
      verdict.textContent = teamsParent ? 'PASS — embedded in Teams' : 'PASS — embedded (parent not Teams)';
      verdict.className = 'verdict pass';
      $('row-status').textContent = 'Embedded';
    } else {
      verdict.textContent = 'FAIL — opened as a top-level page';
      verdict.className = 'verdict fail';
      $('row-status').textContent = 'Not embedded';
    }

    // The SDK handshake is informational. Microsoft's own Website tab app hosts this page, so
    // Teams may not answer a handshake from a page that is not the app's own tab; a timeout
    // here does not fail the embedding check.
    (async () => {
      if (!window.microsoftTeams) { $('sdk').textContent = 'script did not load'; $('ctx').textContent = '—'; return; }
      const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error('timeout 4s')), 4000));
      try {
        await Promise.race([microsoftTeams.app.initialize(), timeout]);
        $('sdk').textContent = 'initialized';
        const ctx = await Promise.race([microsoftTeams.app.getContext(), timeout]);
        $('ctx').textContent = JSON.stringify({
          host: ctx.app?.host?.name, client: ctx.app?.host?.clientType,
          frame: ctx.page?.frameContext, team: ctx.team?.displayName, channel: ctx.channel?.displayName,
          user: ctx.user?.userPrincipalName,
        });
      } catch (e) {
        $('sdk').textContent = 'no handshake (' + (e && e.message) + ')';
        $('ctx').textContent = '—';
      }
    })();
  </script>
</body>
</html>
